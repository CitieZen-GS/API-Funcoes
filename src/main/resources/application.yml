spring:
  application:
    name: AjudanteFamiliar

  # Flyway: migrations com o padrão M_AJ_VXX__descricao.sql
  flyway:
    locations: classpath:db/migration
    sql-migration-prefix: M_AJ_V

  # RabbitMQ: endereço vem do compose.yaml (local) ou de SPRING_RABBITMQ_* (nuvem).
  # Consumidores: 3 tentativas com intervalo de 1s; depois a mensagem vai para a fila .dlq
  # (não volta para a fila principal, para não ficar repetindo o erro para sempre).
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  # O schema é gerenciado só pelo Flyway: o Hibernate não cria nem altera tabelas
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

# JWT: mesmo segredo usado pela API de autenticação para assinar os tokens (HS256, mínimo 32 caracteres).
# Em produção, defina a variável de ambiente JWT_SEGREDO.
jwt:
  segredo: "${JWT_SEGREDO:ajudante-familiar-segredo-dev-troque-em-producao}"

# Swagger / OpenAPI (springdoc): http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true

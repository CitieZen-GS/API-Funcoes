spring.application.name=AjudanteFamiliar

# Flyway: migrations com o padrão M_AJ_VXX__descricao.sql
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=M_AJ_V

# O schema é gerenciado só pelo Flyway: o Hibernate não cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

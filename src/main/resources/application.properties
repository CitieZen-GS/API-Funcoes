spring.application.name=AjudanteFamiliar

# Flyway: migrations com o padrão M_AJ_VXX__descricao.sql
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=M_AJ_V

# O schema é gerenciado só pelo Flyway: o Hibernate não cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: mesmo segredo usado pela API de autenticação para assinar os tokens (HS256, mínimo 32 caracteres).
# Em produção, defina a variável de ambiente JWT_SEGREDO.
jwt.segredo=${JWT_SEGREDO:ajudante-familiar-segredo-dev-troque-em-producao}

# Swagger / OpenAPI (springdoc): http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
